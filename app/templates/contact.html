{%extends "base.html"%} {%block title%}Contact{%endblock%} {%block content%}
<div class="contact_form">
  <div
    class="card border-0 shadow-sm p-4 form-v1"
    style="max-width: 520px; border-radius: 14px"
  >
    <div class="row g-2 mb-3">
      <div class="col form-floating">
        <input
          type="text"
          class="form-control"
          id="fn1"
          placeholder="First name"
        />
        <label for="fn1">First name</label>
      </div>
      <div class="col form-floating">
        <input
          type="text"
          class="form-control"
          id="ln1"
          placeholder="Last name"
        />
        <label for="ln1">Last name</label>
      </div>
    </div>
    <div class="form-floating mb-3">
      <input
        type="email"
        class="form-control"
        id="em1"
        placeholder="name@example.com"
      />
      <label for="em1">Email address</label>
    </div>
    <div class="form-floating mb-4">
      <textarea
        class="form-control"
        id="msg1"
        placeholder="Message"
        style="height: 110px"
      ></textarea>
      <label for="msg1">Message</label>
    </div>
    <button class="btn-send">Send message</button>
  </div>
</div>
{%endblock%}
