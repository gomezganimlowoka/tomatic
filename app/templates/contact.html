{%extends "base.html"%} 
{%block title%}Contact{%endblock%} 

{%block content%}
<div class="contact_form">
  <div class="card border-0 shadow-sm p-4 form-v1" style="max-width: 520px; border-radius: 14px">

    <form method="POST"">
      {{ csrf_token() if csrf }}  {# include if using Flask-WTF CSRF #}

      <div class=" row g-2 mb-3">
      <div class="col form-floating">
        <input type="text" class="form-control" id="fn1" name="first_name" placeholder="First name" required />
        <label for="fn1">First name</label>
      </div>
      <div class="col form-floating">
        <input type="text" class="form-control" id="ln1" name="last_name" placeholder="Last name" required />
        <label for="ln1">Last name</label>
      </div>
  </div>

  <div class="form-floating mb-3">
    <input type="email" class="form-control" id="em1" name="email" placeholder="name@example.com" required />
    <label for="em1">Email address</label>
  </div>

  <div class="form-floating mb-4">
    <textarea class="form-control" id="msg1" name="message" placeholder="Message" style="height: 110px"
      required></textarea>
    <label for="msg1">Message</label>
  </div>

  <div id="success-msg" class="alert alert-success d-none mb-3">Message sent successfully!</div>
  <div id="error-msg" class="alert alert-danger d-none mb-3">Failed to send message. Please try again later.</div>


  <button type="submit" class="btn-send" onclick="onSubmit(event)">Send message</button>
  </form>
</div>
</div>

{%endblock%}
