<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title%}Document{% endblock%}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="{{ url_for('static', filename='favicon.ico') }}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <nav>
      <h4>Tomatoic</h4>
      <ul>
        <li><a href=".">Home</a></li>
        <li><a href="/contacts">Contact</a></li>
        <li><a href="/service">Our services</a></li>
        <li><a href="/about">About</a></li>
      </ul>
      <img class="icon" src="{{ url_for('static', filename='assets/happy.png') }}" alt="Icon" />
    </nav>
    {% block content%} {% endblock %}
    <div class="footer">&copy; 2025 Tomatic | Built by Gomezgani Mlowoka</div>
    <!-- in base.html, before </body> -->
    <script src="{{ url_for('static', filename='js/predict.js') }}"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
