<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title%}Document{% endblock%}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background-color: #ec8a88; /* tomato red */ color: #ffffff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);">
        <h4 style=" margin: 0; font-size: 1.4rem; font-weight: 600; letter-spacing: 0.5px;">Tomatoic</h4>
        <img style="width: 36px; height: 36px; object-fit: contain;border-radius: 50%; cursor: pointer;" src="../static/assets/happy.png" alt="Icon" />
    </div>
    <nav>
        <ul>
            <li><a href=".">Home</a></li>
            <li><a href="/contacts">Contact</a></li>
            <li><a href="/service">Our services</a></li>
            <li><a href="/about">About</a></li>
        </ul>
    </nav>
    {% block content%}

    {% endblock %}
    <div class="footer">&copy; 2025 Tomatic | Built by Gomezgani Mlowoka
    </div>
    <script src="{{ url_for('static', filename='js/darkmode-toggle.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>

</html>
